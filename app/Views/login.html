<!doctype html><html lang="en" class="dark"><head><title>Operator login - Tessera</title>{{head}}</head>
<body class="min-h-screen font-sans text-slate-200">
<main class="mx-auto mt-24 max-w-sm px-4">
  <div class="card">
    <h1 class="mb-1 text-xl font-bold text-white">Operator login</h1>
    <p class="mb-4 text-sm text-slate-400">Tessera compliance console.</p>
    <p class="mb-3 text-sm text-red-300">{{error}}</p>
    <form method="post" action="/login" class="space-y-3">
      <div><label class="label" for="password">Password</label><input id="password" name="password" type="password" class="input" autofocus></div>
      <button class="btn-gold w-full">Sign in</button>
    </form>
  </div>
</main>
</body></html>
